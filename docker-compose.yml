# Convenience wrapper. Optionally set IMAGE_DIR / PORT / REFLASHER_PASSWORD /
# REFLASHER_PUBLIC_URL, then:
#   docker compose up
#
# The image directory is mounted read-write at /data so the admin UI can
# upload, archive and delete images and save script assignments.
services:
  reflasher:
    build: .
    image: reflasher
    init: true                       # tini as PID 1 so Ctrl-C / `stop` are clean
    ports:
      - "${PORT:-8080}:8080"         # host:container — Pis curl the host port
    volumes:
      - "${IMAGE_DIR:-./images}:/data"
    environment:
      - REFLASHER_PASSWORD=${REFLASHER_PASSWORD:-}
      - REFLASHER_PUBLIC_URL=${REFLASHER_PUBLIC_URL:-}
